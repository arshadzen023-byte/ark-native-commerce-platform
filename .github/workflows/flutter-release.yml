name: GlowHit Android Release
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, feature/glowhit-my-orders-redesign-2026-11-22]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: glowhit-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --project-name glowhit --org com.ark --platforms android .
      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle')
          text = settings.read_text()
          if 'com.google.gms.google-services' not in text:
              text = text.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false', 1)
              settings.write_text(text)
          app = Path('android/app/build.gradle')
          text = app.read_text()
          if 'id "com.google.gms.google-services"' not in text:
              text = text.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services"', 1)
              app.write_text(text)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.permission.POST_NOTIFICATIONS' not in text:
              end = text.find('>', text.find('<manifest'))
              text = text[:end+1] + '\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' + text[end+1:]
              manifest.write_text(text)
          if 'com.ark.glowhit' not in Path('android/app/google-services.json').read_text():
              raise SystemExit('Firebase package name mismatch')
          print('Firebase configuration verified for com.ark.glowhit')
          PY
      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml'); t=p.read_text()
          if 'android.permission.INTERNET' not in t:
              i=t.find('>',t.find('<manifest')); t=t[:i+1]+'\n    <uses-permission android:name="android.permission.INTERNET" />'+t[i+1:]; p.write_text(t)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: glowhit-v1.0.8-fcm-notifications
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
