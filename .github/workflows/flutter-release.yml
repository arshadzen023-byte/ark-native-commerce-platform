name: GlowHit Android Release
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glowhit-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --project-name glowhit_shopping --org shop.pluginstore --platforms android .
      - name: Ensure Android internet permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Android manifest was not generated: {manifest}")

          text = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in text:
              start = text.find("<manifest")
              end = text.find(">", start)
              if start < 0 or end < 0:
                  raise SystemExit("Could not find the opening <manifest> tag")
              text = text[:end + 1] + chr(10) + permission + text[end + 1:]
              manifest.write_text(text, encoding="utf-8")

          verified = manifest.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in verified:
              raise SystemExit("INTERNET permission was not added")
          print("Verified INTERNET permission in AndroidManifest.xml")
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: glowhit-checkout-v1-build-81
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
