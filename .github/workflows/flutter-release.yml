name: GlowHit Android Release
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: glowhit-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --project-name glowhit_shopping --org shop.pluginstore --platforms android .
      - name: Ensure Android internet permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Android manifest was not generated: {manifest}")

          text = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in text:
              start = text.find("<manifest")
              end = text.find(">", start)
              if start < 0 or end < 0:
                  raise SystemExit("Could not find the opening <manifest> tag")
              text = text[:end + 1] + chr(10) + permission + text[end + 1:]
              manifest.write_text(text, encoding="utf-8")

          verified = manifest.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in verified:
              raise SystemExit("INTERNET permission was not added")
          print("Verified INTERNET permission in AndroidManifest.xml")
          PY
      - name: Install Android NDK with retry protection
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_PACKAGE="ndk;28.2.13676358"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Installing $NDK_PACKAGE (attempt $attempt/3)"
            if "$SDKMANAGER" --install "$NDK_PACKAGE" --verbose; then
              if [[ -f "$SDK_ROOT/ndk/28.2.13676358/source.properties" ]]; then
                echo "Verified NDK 28.2.13676358 installation"
                exit 0
              fi
              echo "NDK install returned success but source.properties is missing"
            fi
            rm -rf "$SDK_ROOT/ndk/28.2.13676358"
            rm -rf "$SDK_ROOT/.temp"/*
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 15)); fi
          done
          echo "::error::NDK 28.2.13676358 failed to install after 3 attempts"
          exit 1
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: glowhit-v1.0.7-checkout
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish installable APK release
        if: github.ref == 'refs/heads/feature/glowhit-checkout-redesign-2026-11-23'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glowhit-v1.0.7-checkout-redesign-2026-11-23
          name: GlowHit v1.0.7 — Checkout redesign
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/app/outputs/flutter-apk/app-release.apk
