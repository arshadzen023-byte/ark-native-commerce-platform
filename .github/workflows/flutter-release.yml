name: GlowHit Android CI and Release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glowhit-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --project-name glowhit_shopping --org shop.pluginstore --platforms android .
      - name: Enable core library desugaring for notifications
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((path for path in candidates if path.is_file()), None)
          if gradle is None:
              raise SystemExit("Generated Android app Gradle file was not found")

          content = gradle.read_text(encoding="utf-8")
          kotlin_dsl = gradle.suffix == ".kts"

          # Enable desugaring inside the Android compileOptions block.
          match = re.search(r"(?m)^\s*compileOptions\s*\{", content)
          if not match:
              raise SystemExit(f"compileOptions block not found in {gradle}")
          opening = content.find("{", match.start())
          depth = 0
          closing = -1
          for index in range(opening, len(content)):
              if content[index] == "{":
                  depth += 1
              elif content[index] == "}":
                  depth -= 1
                  if depth == 0:
                      closing = index
                      break
          if closing < 0:
              raise SystemExit("Could not parse compileOptions block")

          enabled = "isCoreLibraryDesugaringEnabled = true" if kotlin_dsl else "coreLibraryDesugaringEnabled true"
          block = content[opening:closing]
          if "coreLibraryDesugaringEnabled" not in block:
              content = content[:closing] + "    " + enabled + "\n" + content[closing:]

          # Add the desugaring runtime dependency once.
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' if kotlin_dsl else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
          if "desugar_jdk_libs" not in content:
              dependencies = re.search(r"(?m)^\s*dependencies\s*\{", content)
              if dependencies:
                  dep_open = content.find("{", dependencies.start())
                  depth = 0
                  dep_close = -1
                  for index in range(dep_open, len(content)):
                      if content[index] == "{":
                          depth += 1
                      elif content[index] == "}":
                          depth -= 1
                          if depth == 0:
                              dep_close = index
                              break
                  if dep_close < 0:
                      raise SystemExit("Could not parse dependencies block")
                  content = content[:dep_close] + "    " + dependency + "\n" + content[dep_close:]
              else:
                  content += "\ndependencies {\n    " + dependency + "\n}\n"

          gradle.write_text(content, encoding="utf-8")
          verified = gradle.read_text(encoding="utf-8")
          desugaring_enabled = (
              "isCoreLibraryDesugaringEnabled = true" in verified
              or "coreLibraryDesugaringEnabled true" in verified
              or "coreLibraryDesugaringEnabled = true" in verified
          )
          if not desugaring_enabled or "desugar_jdk_libs:2.1.5" not in verified:
              raise SystemExit("Core library desugaring configuration verification failed")
          print(f"Verified core library desugaring in {gradle}")
          PY
      - name: Ensure Android internet permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Android manifest was not generated: {manifest}")
          content = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if "android.permission.INTERNET" not in content:
              start = content.find("<manifest")
              end = content.find(">", start)
              if start < 0 or end < 0:
                  raise SystemExit("Could not find the opening <manifest> tag")
              content = content[:end + 1] + chr(10) + permission + content[end + 1:]
              manifest.write_text(content, encoding="utf-8")
          if "android.permission.INTERNET" not in manifest.read_text(encoding="utf-8"):
              raise SystemExit("INTERNET permission was not added")
          print("Verified INTERNET permission")
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: Flutter widget and unit tests
        run: flutter test --reporter expanded
      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            log_file="$(mktemp)"
            if flutter build apk --release 2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              exit 0
            fi
            if grep -Eqi '429|Too Many Requests|Gradle threw an error while downloading artifacts|Could not GET.*(maven|gradle)' "$log_file"; then
              if [ "$attempt" -lt 4 ]; then
                delay=$((attempt * 30))
                echo "Dependency repository rate-limited the build. Retrying in ${delay}s (attempt $((attempt + 1))/4)."
                rm -f "$log_file"
                sleep "$delay"
              else
                echo "Dependency repository remained rate-limited after 4 attempts."
                rm -f "$log_file"
                exit 1
              fi
            else
              echo "Build failed for a non-rate-limit reason; not retrying."
              rm -f "$log_file"
              exit 1
            fi
          done
          exit 1
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: glowhit-${{ github.ref_name }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
