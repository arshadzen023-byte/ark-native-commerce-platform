name: GlowHit Android Release
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: glowhit-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --project-name glowhit_shopping --org shop.pluginstore --platforms android .
      - name: Use official Gradle distribution mirror
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.is_file():
              raise SystemExit(f"Gradle wrapper properties missing: {wrapper}")

          text = wrapper.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(?m)^distributionUrl=.*$",
              r"distributionUrl=https\\://downloads.gradle.org/distributions/gradle-9.5.0-bin.zip",
              text,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one distributionUrl, found {count}")
          wrapper.write_text(updated, encoding="utf-8")
          check = wrapper.read_text(encoding="utf-8")
          if "downloads.gradle.org/distributions/gradle-9.5.0-bin.zip" not in check:
              raise SystemExit("Gradle distribution URL patch verification failed")
          print("Gradle wrapper now uses the official downloads.gradle.org binary distribution")
          PY
      - name: Ensure Android internet permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Android manifest was not generated: {manifest}")

          text = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in text:
              start = text.find("<manifest")
              end = text.find(">", start)
              if start < 0 or end < 0:
                  raise SystemExit("Could not find the opening <manifest> tag")
              text = text[:end + 1] + chr(10) + permission + text[end + 1:]
              manifest.write_text(text, encoding="utf-8")

          verified = manifest.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in verified:
              raise SystemExit("INTERNET permission was not added")
          print("Verified INTERNET permission in AndroidManifest.xml")
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: glowhit-v1.0.4-build-84
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish installable APK release
        if: startsWith(github.ref, 'refs/heads/feature/glowhit-saved-customer-address-2026-11-22')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glowhit-v1.0.4-saved-customer-address-2026-11-22
          name: GlowHit v1.0.4 — Saved customer addresses and native payments
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/app/outputs/flutter-apk/app-release.apk
