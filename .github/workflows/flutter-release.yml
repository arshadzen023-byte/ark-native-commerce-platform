name: GlowHit Android CI and Release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glowhit-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --project-name glowhit --org com.ark --platforms android .
      - name: Configure clean native launch window
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main/res")
          launch = root / "drawable" / "launch_background.xml"
          launch.parent.mkdir(parents=True, exist_ok=True)
          launch.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
          </layer-list>
          """, encoding="utf-8")

          for folder in ("values", "values-night"):
              styles = root / folder / "styles.xml"
              if not styles.exists():
                  continue
              text = styles.read_text(encoding="utf-8")
              text = re.sub(
                  r'<item name="android:windowBackground">.*?</item>',
                  '<item name="android:windowBackground">@drawable/launch_background</item>',
                  text,
                  flags=re.S,
              )
              styles.write_text(text, encoding="utf-8")
          print("Configured a non-black Android launch window; Flutter content paints immediately above it.")
          PY
      - name: Configure Android native launch splash on legacy and Android 12+ devices
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          res = Path("android/app/src/main/res")
          legacy = res / "drawable" / "launch_background.xml"
          legacy.parent.mkdir(parents=True, exist_ok=True)
          legacy.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="#51408F" />
          </layer-list>
          """, encoding="utf-8")

          # Android 11 and earlier use the launch window background.
          for folder in ("values", "values-night"):
              styles = res / folder / "styles.xml"
              if not styles.exists():
                  continue
              text = styles.read_text(encoding="utf-8")
              item = '<item name="android:windowBackground">@drawable/launch_background</item>'
              pattern = r'<item name="android:windowBackground">.*?</item>'
              if re.search(pattern, text, flags=re.S):
                  text = re.sub(pattern, item, text, count=1, flags=re.S)
              else:
                  match = re.search(r'<style name="LaunchTheme"[^>]*>', text)
                  if not match:
                      raise SystemExit(f"LaunchTheme missing in {styles}")
                  text = text[:match.end()] + "\n        " + item + text[match.end():]
              styles.write_text(text, encoding="utf-8")

          # Android 12+ owns a system splash window before Flutter starts.
          # Use the app launcher icon and a branded background; the published
          # Designer splash takes over edge-to-edge immediately after Flutter's
          # first frame, since Android's pre-activity screen cannot fetch remote media.
          v31 = res / "values-v31" / "styles.xml"
          if not v31.exists():
              raise SystemExit("Android 12+ values-v31/styles.xml was not generated")
          text = v31.read_text(encoding="utf-8")
          launch_match = re.search(r'<style name="LaunchTheme"[^>]*>(.*?)</style>', text, flags=re.S)
          if not launch_match:
              raise SystemExit("Android 12+ LaunchTheme not found")
          block = launch_match.group(1)
          items = {
              "android:windowSplashScreenBackground": "#51408F",
              "android:windowSplashScreenAnimatedIcon": "@mipmap/ic_launcher",
          }
          for name, value in items.items():
              item = f'<item name="{name}">{value}</item>'
              pattern = rf'<item name="{re.escape(name)}">.*?</item>'
              if re.search(pattern, block, flags=re.S):
                  block = re.sub(pattern, item, block, count=1, flags=re.S)
              else:
                  block += "\n        " + item
          text = text[:launch_match.start(1)] + block + text[launch_match.end(1):]
          v31.write_text(text, encoding="utf-8")

          for path in (res / "values" / "styles.xml", res / "values-night" / "styles.xml", v31):
              if path.exists():
                  data = path.read_text(encoding="utf-8")
                  if "LaunchTheme" not in data:
                      raise SystemExit(f"LaunchTheme validation failed: {path}")
          print("Configured branded Android launch splash for legacy and Android 12+.")
          PY
      - name: Preserve GlowHit Android identity and Firebase
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          app = next((path for path in candidates if path.is_file()), None)
          if app is None:
              raise SystemExit("Generated Android app Gradle file was not found")
          kotlin_dsl = app.suffix == ".kts"
          text = app.read_text(encoding="utf-8")

          # Keep the existing Android application identity so users can update
          # the installed GlowHit app instead of receiving a second app.
          app_id = 'applicationId = "com.ark.glowhit"'
          namespace = 'namespace = "com.ark.glowhit"'
          for key, replacement in (("applicationId", app_id), ("namespace", namespace)):
              pattern = rf'(?m)^\s*{key}\s*(?:=\s*)?"[^"]+"'
              if re.search(pattern, text):
                  text = re.sub(pattern, replacement, text, count=1)
              elif key == "applicationId":
                  marker = "defaultConfig {"
                  if marker not in text:
                      raise SystemExit("Android defaultConfig block not found")
                  text = text.replace(marker, marker + "\n        " + replacement, 1)
              else:
                  marker = "android {"
                  if marker not in text:
                      raise SystemExit("Android block not found for namespace")
                  text = text.replace(marker, marker + "\n    " + replacement, 1)

          plugin = 'id("com.google.gms.google-services")' if kotlin_dsl else "id 'com.google.gms.google-services'"
          if "com.google.gms.google-services" not in text:
              marker = "plugins {"
              if marker not in text:
                  raise SystemExit("App Gradle plugins block not found")
              text = text.replace(marker, marker + "\n    " + plugin, 1)
          app.write_text(text, encoding="utf-8")

          settings_candidates = [Path("android/settings.gradle.kts"), Path("android/settings.gradle")]
          settings = next((path for path in settings_candidates if path.is_file()), None)
          if settings is None:
              raise SystemExit("Generated Android settings Gradle file was not found")
          settings_text = settings.read_text(encoding="utf-8")
          if "com.google.gms.google-services" not in settings_text:
              plugin_decl = ('id("com.google.gms.google-services") version "4.4.2" apply false'
                             if settings.suffix == ".kts"
                             else 'id "com.google.gms.google-services" version "4.4.2" apply false')
              marker = "plugins {"
              if marker not in settings_text:
                  raise SystemExit("Android settings plugins block not found")
              settings_text = settings_text.replace(marker, marker + "\n    " + plugin_decl, 1)
              settings.write_text(settings_text, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest_text = manifest.read_text(encoding="utf-8")
          if re.search(r'android:label="[^"]+"', manifest_text):
              manifest_text = re.sub(r'android:label="[^"]+"', 'android:label="GlowHit"', manifest_text, count=1)
          else:
              raise SystemExit("Android manifest label was not found")
          manifest.write_text(manifest_text, encoding="utf-8")

          gradle_text = app.read_text(encoding="utf-8")
          firebase_text = Path("android/app/google-services.json").read_text(encoding="utf-8")
          if "com.ark.glowhit" not in gradle_text or '"package_name":"com.ark.glowhit"' not in firebase_text:
              raise SystemExit("GlowHit Android application ID and Firebase package do not match")
          if 'android:label="GlowHit"' not in manifest.read_text(encoding="utf-8"):
              raise SystemExit("GlowHit app display name was not preserved")
          print("Verified package ID com.ark.glowhit, Firebase config and app label GlowHit")
          PY
      - name: Enable core library desugaring for notifications
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((path for path in candidates if path.is_file()), None)
          if gradle is None:
              raise SystemExit("Generated Android app Gradle file was not found")

          content = gradle.read_text(encoding="utf-8")
          kotlin_dsl = gradle.suffix == ".kts"

          # Enable desugaring inside the Android compileOptions block.
          match = re.search(r"(?m)^\s*compileOptions\s*\{", content)
          if not match:
              raise SystemExit(f"compileOptions block not found in {gradle}")
          opening = content.find("{", match.start())
          depth = 0
          closing = -1
          for index in range(opening, len(content)):
              if content[index] == "{":
                  depth += 1
              elif content[index] == "}":
                  depth -= 1
                  if depth == 0:
                      closing = index
                      break
          if closing < 0:
              raise SystemExit("Could not parse compileOptions block")

          enabled = "isCoreLibraryDesugaringEnabled = true" if kotlin_dsl else "coreLibraryDesugaringEnabled true"
          block = content[opening:closing]
          if "coreLibraryDesugaringEnabled" not in block:
              content = content[:closing] + "    " + enabled + "\n" + content[closing:]

          # Add the desugaring runtime dependency once.
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' if kotlin_dsl else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
          if "desugar_jdk_libs" not in content:
              dependencies = re.search(r"(?m)^\s*dependencies\s*\{", content)
              if dependencies:
                  dep_open = content.find("{", dependencies.start())
                  depth = 0
                  dep_close = -1
                  for index in range(dep_open, len(content)):
                      if content[index] == "{":
                          depth += 1
                      elif content[index] == "}":
                          depth -= 1
                          if depth == 0:
                              dep_close = index
                              break
                  if dep_close < 0:
                      raise SystemExit("Could not parse dependencies block")
                  content = content[:dep_close] + "    " + dependency + "\n" + content[dep_close:]
              else:
                  content += "\ndependencies {\n    " + dependency + "\n}\n"

          gradle.write_text(content, encoding="utf-8")
          verified = gradle.read_text(encoding="utf-8")
          desugaring_enabled = (
              "isCoreLibraryDesugaringEnabled = true" in verified
              or "coreLibraryDesugaringEnabled true" in verified
              or "coreLibraryDesugaringEnabled = true" in verified
          )
          if not desugaring_enabled or "desugar_jdk_libs:2.1.5" not in verified:
              raise SystemExit("Core library desugaring configuration verification failed")
          print(f"Verified core library desugaring in {gradle}")
          PY
      - name: Ensure Android internet permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Android manifest was not generated: {manifest}")
          content = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if "android.permission.INTERNET" not in content:
              start = content.find("<manifest")
              end = content.find(">", start)
              if start < 0 or end < 0:
                  raise SystemExit("Could not find the opening <manifest> tag")
              content = content[:end + 1] + chr(10) + permission + content[end + 1:]
              manifest.write_text(content, encoding="utf-8")
          if "android.permission.INTERNET" not in manifest.read_text(encoding="utf-8"):
              raise SystemExit("INTERNET permission was not added")
          print("Verified INTERNET permission")
          PY
      - name: Ensure Android microphone permission for Voice Search
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if "android.permission.RECORD_AUDIO" not in content:
              marker = "    <uses-permission android:name=" + chr(34) + "android.permission.INTERNET" + chr(34) + " />"
              if marker in content:
                  content = content.replace(marker, marker + chr(10) + permission, 1)
              else:
                  start = content.find("<manifest")
                  end = content.find(">", start)
                  if start < 0 or end < 0:
                      raise SystemExit("Could not find opening manifest tag")
                  content = content[:end + 1] + chr(10) + permission + content[end + 1:]
              manifest.write_text(content, encoding="utf-8")
          if "android.permission.RECORD_AUDIO" not in manifest.read_text(encoding="utf-8"):
              raise SystemExit("RECORD_AUDIO permission was not added")
          content = manifest.read_text(encoding="utf-8")
          queries = """  <queries>
              <intent>
                  <action android:name="android.speech.RecognitionService" />
              </intent>
          </queries>"""
          if "android.speech.RecognitionService" not in content:
              marker = "    <application"
              if marker not in content:
                  raise SystemExit("Could not find Android application tag for speech recognition query")
              content = content.replace(marker, queries + chr(10) + marker, 1)
              manifest.write_text(content, encoding="utf-8")
          if "android.speech.RecognitionService" not in manifest.read_text(encoding="utf-8"):
              raise SystemExit("Android speech recognition package visibility query was not added")
          print("Verified RECORD_AUDIO permission and Android 11+ speech recognition query")
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: App Bar Builder regression tests
        run: flutter test test/app_bar_builder_test.dart --reporter expanded
      - name: Flutter widget and unit tests
        run: flutter test --reporter expanded
      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            log_file="$(mktemp)"
            if flutter build apk --release 2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              exit 0
            fi
            if grep -Eqi '429|Too Many Requests|Gradle threw an error while downloading artifacts|Could not GET.*(maven|gradle)' "$log_file"; then
              if [ "$attempt" -lt 4 ]; then
                delay=$((attempt * 30))
                echo "Dependency repository rate-limited the build. Retrying in ${delay}s (attempt $((attempt + 1))/4)."
                rm -f "$log_file"
                sleep "$delay"
              else
                echo "Dependency repository remained rate-limited after 4 attempts."
                rm -f "$log_file"
                exit 1
              fi
            else
              echo "Build failed for a non-rate-limit reason; not retrying."
              rm -f "$log_file"
              exit 1
            fi
          done
          exit 1
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: glowhit-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
