name: GlowHit Android Release
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, feature/glowhit-my-orders-redesign-2026-11-22]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: glowhit-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --project-name glowhit --org com.ark --platforms android .
      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")
          kotlin_dsl = settings.exists() and app.exists()
          if not kotlin_dsl:
              settings = Path("android/settings.gradle")
              app = Path("android/app/build.gradle")
          if not settings.is_file() or not app.is_file():
              raise SystemExit("Generated Android Gradle files were not found")
          settings_text = settings.read_text(encoding="utf-8")
          app_text = app.read_text(encoding="utf-8")
          if kotlin_dsl:
              settings_plugin = '    id("com.google.gms.google-services") version "4.4.2" apply false'
              app_plugin = '    id("com.google.gms.google-services")'
          else:
              settings_plugin = '    id "com.google.gms.google-services" version "4.4.2" apply false'
              app_plugin = '    id "com.google.gms.google-services"'
          if "com.google.gms.google-services" not in settings_text:
              settings_text = settings_text.replace("plugins {", "plugins {\n" + settings_plugin, 1)
              settings.write_text(settings_text, encoding="utf-8")
          if app_plugin not in app_text:
              app_text = app_text.replace("plugins {", "plugins {\n" + app_plugin, 1)

          # flutter_local_notifications needs Java 8+ core library desugaring.
          if kotlin_dsl:
              compile_block = """
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
          }
          """
              dependency_block = """
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          """
              if "isCoreLibraryDesugaringEnabled = true" not in app_text:
                  marker = "android {"
                  if marker not in app_text:
                      raise SystemExit("Android block missing in app/build.gradle.kts")
                  # Add compile options inside the existing android block.
                  app_text = app_text.replace(marker, marker + """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
          """, 1)
              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in app_text:
                  app_text += dependency_block
          else:
              if "coreLibraryDesugaringEnabled true" not in app_text:
                  app_text = app_text.replace("android {", """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }
          """, 1)
              if "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:" not in app_text and 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in app_text:
                  app_text += """
          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
          }
          """
          app.write_text(app_text, encoding="utf-8")
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if "android.permission.POST_NOTIFICATIONS" not in text:
              end = text.find(">", text.find("<manifest"))
              text = text[:end+1] + '\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' + text[end+1:]
              manifest.write_text(text, encoding="utf-8")
          config = Path("android/app/google-services.json").read_text(encoding="utf-8")
          if "com.ark.glowhit" not in config:
              raise SystemExit("Firebase package name mismatch")
          print("Firebase configuration verified for com.ark.glowhit")
          PY
      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml'); t=p.read_text()
          if 'android.permission.INTERNET' not in t:
              i=t.find('>',t.find('<manifest')); t=t[:i+1]+'\n    <uses-permission android:name="android.permission.INTERNET" />'+t[i+1:]; p.write_text(t)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: glowhit-v1.0.8-fcm-notifications
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
